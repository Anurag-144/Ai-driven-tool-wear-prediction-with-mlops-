name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -v
      - name: Validate FastAPI import and production model
        run: |
          python -c "from app.main import app; assert app.title == 'ToolWear AI API'"
          python -c "import joblib, numpy as np; model=joblib.load('models/xgboost_tool_wear.pkl'); value=float(model.predict(np.zeros((1, 12)))[0]); assert np.isfinite(value)"
      - name: Build production container
        run: docker build -t toolwear-api-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  mlops-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mlops.txt
      - name: Install MLOps dependencies
        run: python -m pip install -r requirements-mlops.txt -r requirements-dev.txt
      - name: Validate configuration and DVC graph
        run: |
          python -c "from src.common.config import load_params; params=load_params(); assert params['data']['target'] == 'VB'"
          python -m dvc dag
          python -m dvc metrics show
      - name: Run training pipeline smoke tests
        run: python -m pytest tests/test_training_smoke.py -q
